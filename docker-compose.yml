
services:
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_program
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5433:5432"
    restart: unless-stopped

  web:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      - DB_HOST=db     
      - DB_NAME=finance_program
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

volumes:
  postgres_data: